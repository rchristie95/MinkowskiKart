name: Android Build

on:
  push:
    branches:
      - main
      - master
      - 'antigravity/**'
    tags:
      - '*'
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: "/usr/local/lib/android/sdk"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make ninja-build glslang-tools python3-mako
          pip install "meson==1.4.0" --break-system-packages

      - name: Install Android NDK 23.1.7779620
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;23.1.7779620"

      - name: Cache Android Dependencies Source and Prebuilts
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            lib
            android/deps-arm64-v8a
            android/mesa
          key: ${{ runner.os }}-android-deps-v1-${{ hashFiles('.github/workflows/android.yml') }}

      - name: Download and Extract Android Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "Downloading dependency source archive..."
          curl -L -o dependencies-android-src.tar.xz https://github.com/supertuxkart/dependencies/releases/download/preview/dependencies-android-src.tar.xz
          echo "Extracting dependency sources into lib/..."
          tar -C 'lib' -xf dependencies-android-src.tar.xz
          
          echo "Downloading missing linkernsbypass dependency..."
          mkdir -p lib/libadrenotools/lib/linkernsbypass
          curl -L -o linkernsbypass.tar.gz https://github.com/bylaws/liblinkernsbypass/archive/aa3975893d83ef1bc84c321ec60c65fbf1287887.tar.gz
          echo "Extracting linkernsbypass..."
          tar -C lib/libadrenotools/lib/linkernsbypass --strip-components=1 -xf linkernsbypass.tar.gz
          rm linkernsbypass.tar.gz
          
          echo "Dependencies set up successfully."

      - name: Patch libpng CMakeLists.txt to bypass space-in-path nested quoting bug
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sed -i 's/"${CMAKE_COMMAND}"/cmake/g' lib/libpng/CMakeLists.txt

      - name: Build MinkowskiKart APK
        shell: bash
        run: |
          export SDK_PATH="$ANDROID_SDK_ROOT"
          export NDK_PATH="$ANDROID_SDK_ROOT/ndk"
          export STK_MIN_ANDROID_SDK=21
          export STK_TARGET_ANDROID_SDK=35
          export STK_NDK_VERSION="23.1.7779620"
          export COMPILE_ARCH="aarch64"
          export BUILD_TYPE="debug"
          
          # Go to android/ folder
          cd android
          chmod +x *.sh gradlew
          
          # 1. Package assets (disable resizing/compression for build speed and dependency simplification)
          export DECREASE_QUALITY=0
          export CONVERT_TO_JPG=0
          export ASSETS_PATHS="../data ../stk-assets"
          export KARTS="curie einstein feynman maxwell minkowski newton noether oppenheimer planck tux"
          export TRACKS="abyss cornfield_crossing hacienda ravenbridge_mansion sandtrack scotland snowtuxpeak volcano_island mobius_track tutorial endcutscene featunlocked gplose gpwin introcutscene introcutscene2 overworld arena_candela_city battleisland icy_soccer_field lasdunasarena lasdunassoccer soccer_field xr_soccer alien_signal ancient_colosseum_labyrinth cave hole_drop oasis pumpkin_park stadium temple"
          ./generate_assets.sh

          # Post-process assets for lightweight fork
          echo "Overwriting official_karts.xml in assets..."
          cat << 'EOF' > assets/data/official_karts.xml
<?xml version="1.0"?>
<karts>
    <kart name="tux" type="medium" width="0.821" height="0.675" length="1.437" gravity-shift="0 0.3375 0"/>
</karts>
EOF

          echo "Pruning locked/grand prix challenges in assets..."
          rm -f assets/data/challenges/candela_city.challenge
          rm -f assets/data/challenges/cocoa_temple.challenge
          rm -f assets/data/challenges/fortmagma.challenge
          rm -f assets/data/challenges/gp1.challenge
          rm -f assets/data/challenges/gp2.challenge
          rm -f assets/data/challenges/gp3.challenge
          rm -f assets/data/challenges/gp4.challenge
          rm -f assets/data/challenges/granparadiso_island.challenge
          rm -f assets/data/challenges/green_valley.challenge
          rm -f assets/data/challenges/lighthouse.challenge
          rm -f assets/data/challenges/mines.challenge
          rm -f assets/data/challenges/minigolf.challenge
          rm -f assets/data/challenges/olivermath.challenge
          rm -f assets/data/challenges/snowmountain.challenge
          rm -f assets/data/challenges/stk_enterprise.challenge
          rm -f assets/data/challenges/unlock_bonus_kart1.challenge
          rm -f assets/data/challenges/unlock_bonus_kart2.challenge
          rm -f assets/data/challenges/unlock_supertux.challenge
          rm -f assets/data/challenges/xr591.challenge
          rm -f assets/data/challenges/zengarden.challenge
          
          # 2. Compile static native libraries
          ./make_deps.sh
          
          # 3. Build APK and compile JNI shared libraries
          ./make.sh

      - name: Set release target
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo "release_pre=false" >> $GITHUB_ENV
          else
            echo "release_tag=preview" >> $GITHUB_ENV
            echo "release_pre=true" >> $GITHUB_ENV
          fi

      - name: Force update preview tag and release target to current commit
        if: ${{ env.release_tag == 'preview' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if command -v gh &> /dev/null; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/preview" -F sha="${{ github.sha }}" -F force=true || true
            gh release edit preview --target "${{ github.sha }}" --prerelease || true
          else
            echo "gh CLI not found, skipping tag update"
          fi


      - name: Rename APK with release tag
        if: ${{ env.release_tag != '' }}
        shell: bash
        run: |
          APK=$(ls android/build/outputs/apk/debug/*.apk | head -1)
          DEST="MinkowskiKart-${{ env.release_tag }}-android.apk"
          cp "$APK" "$DEST"
          echo "apk_path=$DEST" >> $GITHUB_ENV

      - name: Upload APK to release
        if: ${{ env.release_tag != '' }}
        uses: ncipollo/release-action@v1.8.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "${{ env.apk_path }}"
          tag: ${{ env.release_tag }}
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          allowUpdates: true
          replacesArtifacts: true
          prerelease: ${{ env.release_pre }}

      - name: Upload MinkowskiKart APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinkowskiKart-Android-Debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
