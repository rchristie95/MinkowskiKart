name: Android Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: windows-2022
    env:
      ANDROID_HOME: "C:/android-sdk"
      ANDROID_SDK_ROOT: "C:/android-sdk"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create space-free Android SDK junction
        run: |
          mklink /J C:\android-sdk "C:\Program Files (x86)\Android\android-sdk"
        shell: cmd

      - name: Create short build directory
        run: |
          mkdir C:\s
        shell: cmd

      - name: Create space-free CMake junction
        run: |
          mklink /J C:\cmake "C:\Program Files\CMake"
        shell: cmd

      - name: Create custom space-free realpath wrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\s\bin"
          $content = @'
          #!/bin/sh
          if [ -z "$1" ]; then
              echo ""
          else
              python -c "import os, sys; path = sys.argv[1]; (drive, path) = (path[1].upper(), path[2:]) if path.startswith('/') and len(path) > 2 and path[2] == '/' else ('', path); abs_path = os.path.abspath(drive + ':' + path if drive else path).replace(chr(92), '/'); print('/' + abs_path[0].lower() + abs_path[2:] if len(abs_path) > 1 and abs_path[1] == ':' else abs_path)" "$1"
          fi
          '@
          Set-Content -Path "C:\s\bin\realpath" -Value $content -NoNewline

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Make
        run: choco install make -y

      - name: Install meson
        run: pip install meson

      - name: Install Android NDK 23.1.7779620
        shell: pwsh
        run: |
          echo "y" | & "$env:ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager.bat" --install "ndk;23.1.7779620"

      - name: Download and Extract Android Dependencies
        shell: bash
        run: |
          echo "Downloading dependency source archive..."
          curl -L -o dependencies-android-src.tar.xz https://github.com/supertuxkart/dependencies/releases/download/preview/dependencies-android-src.tar.xz
          echo "Extracting dependency sources into lib/..."
          tar -C 'lib' -xf dependencies-android-src.tar.xz
          
          echo "Downloading missing linkernsbypass dependency..."
          mkdir -p lib/libadrenotools/lib/linkernsbypass
          curl -L -o linkernsbypass.tar.gz https://github.com/bylaws/liblinkernsbypass/archive/aa3975893d83ef1bc84c321ec60c65fbf1287887.tar.gz
          echo "Extracting linkernsbypass..."
          tar -C lib/libadrenotools/lib/linkernsbypass --strip-components=1 -xf linkernsbypass.tar.gz
          rm linkernsbypass.tar.gz
          
          echo "Dependencies set up successfully."

      - name: Patch libpng CMakeLists.txt to bypass space-in-path nested quoting bug
        shell: bash
        run: |
          sed -i 's/"${CMAKE_COMMAND}"/cmake/g' lib/libpng/CMakeLists.txt

      - name: Build MinkowskiKart APK
        shell: bash
        run: |
          # Make custom realpath wrapper executable
          chmod +x /c/s/bin/realpath

          # Prepend space-free CMake junction path and custom realpath to bypass cmd.exe nested quoting issues
          export PATH="/c/s/bin:C:/cmake/bin:$PATH"

          # Align Android SDK environment variables to prevent path conflicts
          export ANDROID_HOME="C:\android-sdk"
          export ANDROID_SDK_ROOT="C:\android-sdk"
          
          # Use cygpath to dynamically find the correct Unix SDK & NDK paths
          SDK_PATH=$(cygpath -u "$ANDROID_HOME")
          NDK_PATH="$SDK_PATH/ndk"
          
          export SDK_PATH="$SDK_PATH"
          export NDK_PATH="$NDK_PATH"
          export STK_MIN_ANDROID_SDK=21
          export STK_TARGET_ANDROID_SDK=35
          export STK_NDK_VERSION="23.1.7779620"
          export COMPILE_ARCH="aarch64"
          export BUILD_TYPE="debug"
          
          # Go to android/ folder
          cd android
          
          # 1. Package assets (disable resizing/compression for build speed and dependency simplification)
          export DECREASE_QUALITY=0
          export CONVERT_TO_JPG=0
          export ASSETS_PATHS="../data ../stk-assets"
          ./generate_assets.sh
          
          # 2. Compile static native libraries
          ./make_deps.sh
          
          # 3. Build APK and compile JNI shared libraries
          ./make.sh

      - name: Upload MinkowskiKart APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinkowskiKart-Android-Debug
          path: C:/s/outputs/apk/debug/*.apk
