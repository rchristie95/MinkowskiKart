name: Android Build

on:
  push:
    branches:
      - main
      - master
      - 'antigravity/**'
    tags:
      - '*'
  pull_request: {}
  workflow_dispatch:
    inputs:
      build_release_artifact:
        description: 'Build a signed release APK/AAB as workflow artifacts without updating a GitHub release'
        type: boolean
        required: false
        default: false
      production_release_tag:
        description: 'Existing release tag to replace with a signed production Android build (for example, 2.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && 'android-signing' || 'android-debug' }}
    outputs:
      release_tag: ${{ steps.release-target.outputs.release_tag }}
      release_pre: ${{ steps.release-target.outputs.release_pre }}
    env:
      TRUSTED_SIGNING: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
      PRODUCTION_RELEASE_TAG: ${{ github.event.inputs.production_release_tag }}
      BUILD_RELEASE_ARTIFACT: ${{ github.event.inputs.build_release_artifact }}
      ANDROID_HOME: "/usr/local/lib/android/sdk"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify signing commit belongs to the default branch
        if: ${{ env.TRUSTED_SIGNING == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin || true
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' || true
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master' || true
          for branch in main master; do
            if git show-ref --verify --quiet "refs/remotes/origin/$branch" &&
               git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
              exit 0
            fi
          done
          echo 'Signing requires a commit already present on main or master.' >&2
          exit 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make ninja-build glslang-tools python3-mako imagemagick pngquant vorbis-tools
          pip install "meson==1.4.0" --break-system-packages

      - name: Install Android NDK 28.1.13356709
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.1.13356709"

      - name: Cache Android Dependencies Source and Prebuilts
        id: cache-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            lib
            android/deps-arm64-v8a
            android/mesa
          key: ${{ runner.os }}-android-deps-v2-${{ hashFiles('.github/workflows/android.yml', '.github/build-inputs.json', 'android/Android.mk', 'android/build.gradle', 'android/make.sh') }}

      - name: Download and Extract Android Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "Downloading dependency source archive..."
          python tools/ci/download_verified.py dependencies-android-src.tar.xz
          echo "Extracting dependency sources into lib/..."
          tar -C 'lib' -xf dependencies-android-src.tar.xz
          
          echo "Downloading missing linkernsbypass dependency..."
          mkdir -p lib/libadrenotools/lib/linkernsbypass
          python tools/ci/download_verified.py linkernsbypass.tar.gz
          echo "Extracting linkernsbypass..."
          tar -C lib/libadrenotools/lib/linkernsbypass --strip-components=1 -xf linkernsbypass.tar.gz
          rm linkernsbypass.tar.gz
          
          echo "Dependencies set up successfully."

      - name: Patch libpng CMakeLists.txt to bypass space-in-path nested quoting bug
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sed -i 's/"${CMAKE_COMMAND}"/cmake/g' lib/libpng/CMakeLists.txt

      - name: Refresh tracked in-repo libraries over the restored cache
        shell: bash
        run: |
          # The dependency cache stores all of lib/, including the tracked
          # in-repo engine sources (graphics_engine, irrlicht, bullet, ...).
          # Its key does not hash those sources, so on a cache hit the stale
          # cached copies overwrite the fresh checkout and the NDK then compiles
          # current src/ against an out-of-date GEConfig/ge_main.hpp (e.g.
          # "no member named 'm_glow' in 'GE::GEConfig'"). Restore the tracked
          # files to this commit; untracked downloaded deps (libpng, etc.) and
          # the libpng patch above are left untouched.
          git checkout -- lib

      - name: Build MinkowskiKart APK
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ env.TRUSTED_SIGNING == 'true' && secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 || '' }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ env.TRUSTED_SIGNING == 'true' && secrets.ANDROID_UPLOAD_STORE_PASSWORD || '' }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ env.TRUSTED_SIGNING == 'true' && secrets.ANDROID_UPLOAD_KEY_ALIAS || '' }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ env.TRUSTED_SIGNING == 'true' && secrets.ANDROID_UPLOAD_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$PRODUCTION_RELEASE_TAG" && ! "$PRODUCTION_RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo 'Invalid production release tag.' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
            if [[ ! "$TAG_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
              echo 'Invalid release tag.' >&2
              exit 1
            fi
          fi
          export SDK_PATH="$ANDROID_SDK_ROOT"
          export NDK_PATH="$ANDROID_SDK_ROOT/ndk"
          export STK_MIN_ANDROID_SDK=21
          export STK_TARGET_ANDROID_SDK=35
          export STK_NDK_VERSION="28.1.13356709"
          export COMPILE_ARCH="aarch64"
          # The shipping package uses the system Vulkan driver (STK_VULKAN=0),
          # and validation rejects optional Mesa hook libraries. Do not spend
          # release time compiling a driver that cannot be packaged.
          export SKIP_MESA=1
          if [[ "$TRUSTED_SIGNING" != "true" ]]; then
            export BUILD_TYPE="debug"
            export PROJECT_VERSION="git-${GITHUB_SHA::7}"
            ANDROID_PACKAGE_NAME="org.supertuxkart.stk_dbg"
            ANDROID_CHANNEL="Debug"
            ANDROID_APK_VARIANT="debug"
            ANDROID_GRADLE_VARIANT="Debug"
          elif [[ "$GITHUB_REF" == refs/tags/* || -n "$PRODUCTION_RELEASE_TAG" || "$BUILD_RELEASE_ARTIFACT" == "true" ]]; then
            export BUILD_TYPE="release"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              export PROJECT_VERSION="${GITHUB_REF#refs/tags/}"
              ANDROID_CHANNEL="Production"
            elif [[ -n "$PRODUCTION_RELEASE_TAG" ]]; then
              export PROJECT_VERSION="$PRODUCTION_RELEASE_TAG"
              ANDROID_CHANNEL="Production"
            else
              export PROJECT_VERSION="release-test-${GITHUB_RUN_NUMBER}"
              ANDROID_CHANNEL="Release-Test"
            fi
            ANDROID_PACKAGE_NAME="com.rchristie95.minkowskikart"
            ANDROID_APK_VARIANT="release"
            ANDROID_GRADLE_VARIANT="Release"
          elif [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/heads/master ]]; then
            export BUILD_TYPE="beta"
            export PROJECT_VERSION="preview-${GITHUB_RUN_NUMBER}"
            ANDROID_PACKAGE_NAME="org.supertuxkart.stk_beta"
            ANDROID_CHANNEL="Beta"
            ANDROID_APK_VARIANT="release"
            ANDROID_GRADLE_VARIANT="Release"
          else
            export BUILD_TYPE="debug"
            export PROJECT_VERSION="git-${GITHUB_SHA::7}"
            ANDROID_PACKAGE_NAME="org.supertuxkart.stk_dbg"
            ANDROID_CHANNEL="Debug"
            ANDROID_APK_VARIANT="debug"
            ANDROID_GRADLE_VARIANT="Debug"
          fi
          export PROJECT_CODE="$GITHUB_RUN_NUMBER"

          # Production credentials are available only to trusted release refs.
          # PR/feature builds use Gradle's disposable debug signing identity.
          if [[ "$TRUSTED_SIGNING" == "true" ]]; then
          if [[ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ||
                -z "$ANDROID_UPLOAD_STORE_PASSWORD" ||
                -z "$ANDROID_UPLOAD_KEY_ALIAS" ||
                -z "$ANDROID_UPLOAD_KEY_PASSWORD" ]]; then
            echo "Android workflow builds require ANDROID_UPLOAD_KEYSTORE_BASE64,"
            echo "ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, and"
            echo "ANDROID_UPLOAD_KEY_PASSWORD repository secrets."
            exit 1
          fi
          export STK_KEYSTORE="$RUNNER_TEMP/minkowskikart-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$STK_KEYSTORE"
          export STK_STOREPASS="$ANDROID_UPLOAD_STORE_PASSWORD"
          export STK_KEYPASS="$ANDROID_UPLOAD_KEY_PASSWORD"
          export STK_ALIAS="$ANDROID_UPLOAD_KEY_ALIAS"
          fi

          echo "android_package_name=$ANDROID_PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "android_channel=$ANDROID_CHANNEL" >> "$GITHUB_ENV"
          echo "android_apk_variant=$ANDROID_APK_VARIANT" >> "$GITHUB_ENV"
          echo "android_gradle_variant=$ANDROID_GRADLE_VARIANT" >> "$GITHUB_ENV"
          echo "android_version_code=$PROJECT_CODE" >> "$GITHUB_ENV"
          echo "Android package: $ANDROID_PACKAGE_NAME ($ANDROID_CHANNEL), versionCode=$PROJECT_CODE"
          
          # Go to android/ folder
          cd android
          chmod +x *.sh gradlew
          
          # 1. Package assets. Workflow APKs are intended for device testing,
          # so debug builds use the same compact assets as distributable builds.
          export DECREASE_QUALITY=1
          export CONVERT_TO_JPG=1
          export ASSETS_PATHS="../data ../stk-assets"
          ./generate_assets.sh
          
          # 2. Compile static native libraries
          ./make_deps.sh
          
          # 3. Build APK and compile JNI shared libraries
          ./make.sh

      - name: Validate Android APK contents
        shell: bash
        run: |
          set -euo pipefail

          APK=$(ls android/build/outputs/apk/"${{ env.android_apk_variant }}"/*.apk | head -1)
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='${{ env.android_package_name }}'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='${{ env.android_version_code }}'"
          if [[ "${{ env.android_apk_variant }}" == "release" ]]; then
            AAB=$(ls android/build/outputs/bundle/release/*.aab | head -1)
            BASE_COMPRESSED_BYTES=$(python3 - "$AAB" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as bundle:
              print(sum(entry.compress_size for entry in bundle.infolist()
                        if entry.filename.startswith("base/")))
          PY
          )
            echo "Compressed base module size: $BASE_COMPRESSED_BYTES bytes"
            if (( BASE_COMPRESSED_BYTES > 500000000 )); then
              echo "Android base module exceeds the Google Play 500 MB compressed download limit."
              exit 1
            fi
          fi
          unzip -l "$APK" | grep -q 'assets/data/gui/screens/options/options_relativity.stkgui'
          unzip -l "$APK" | grep -q 'assets/data/shaders/header.txt'
          unzip -l "$APK" | grep -q 'assets/files.txt'
          unzip -l "$APK" | grep -q 'assets/has_assets.txt'
          if unzip -p "$APK" assets/data/stk_config.xml | grep -Eq '<relativity([[:space:]>])'; then
            echo "Packaged stk_config.xml must not contain obsolete app-level relativity settings."
            exit 1
          fi
          grep -Eq 'IntUserConfigParam\([[:space:]]*35,[[:space:]]*"c_light_normal"' src/config/user_config.hpp
          grep -Eq '\{[[:space:]]*0u,[[:space:]]*9u[[:space:]]*\}' src/config/user_config.hpp
          grep -Eq 'StringUserConfigParam\([[:space:]]*"mobius_track",[[:space:]]*"last_track"' src/config/user_config.hpp
          grep -q '@android:color/black' android/res/drawable-anydpi-v26/icon.xml
          test -s android/res/drawable/icon.png
          test -s android/res/drawable-xxxhdpi/icon_fg.png

          if test -n "$(find android/res -name 'icon*.png' -size 0 -print -quit)"; then
            echo "Launcher icon resources must not be empty."
            find android/res -name 'icon*.png' -size 0 -print
            exit 1
          fi

          if unzip -l "$APK" | grep -E 'lib/arm64-v8a/lib(hook_impl|main_hook|vulkan_freedreno)\.so'; then
            echo "Optional Mesa hook libraries must not be packaged by default."
            exit 1
          fi

          ZIPALIGN=$(find "$ANDROID_SDK_ROOT/build-tools" -name zipalign -type f | sort -V | tail -1)
          READELF="$ANDROID_SDK_ROOT/ndk/28.1.13356709/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          "$ZIPALIGN" -c -p -v 4 "$APK"

          for lib in \
            android/build/intermediates/merged_native_libs/${{ env.android_apk_variant }}/merge${{ env.android_gradle_variant }}NativeLibs/out/lib/arm64-v8a/libSDL2.so \
            android/build/intermediates/merged_native_libs/${{ env.android_apk_variant }}/merge${{ env.android_gradle_variant }}NativeLibs/out/lib/arm64-v8a/libmain.so
          do
            test -f "$lib"
            "$READELF" -l "$lib" | awk '/LOAD/ && $NF != "0x4000" { bad=1 } END { exit bad }'
          done

      - name: Set release target
        id: release-target
        if: ${{ env.TRUSTED_SIGNING == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event.inputs.production_release_tag != '') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.build_release_artifact == 'true' && github.event.inputs.production_release_tag == '') }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* || -n "$PRODUCTION_RELEASE_TAG" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              RELEASE_TAG="${GITHUB_REF#refs/tags/}"
            else
              RELEASE_TAG="$PRODUCTION_RELEASE_TAG"
            fi
            echo "release_tag=$RELEASE_TAG" >> $GITHUB_ENV
            RELEASE_PRE=false
            echo "release_pre=false" >> $GITHUB_ENV
          else
            RELEASE_TAG=preview
            RELEASE_PRE=true
            echo "release_tag=preview" >> $GITHUB_ENV
            echo "release_pre=true" >> $GITHUB_ENV
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_pre=$RELEASE_PRE" >> "$GITHUB_OUTPUT"

      - name: Rename APK with release tag
        if: ${{ env.release_tag != '' }}
        shell: bash
        run: |
          APK=$(ls android/build/outputs/apk/"${{ env.android_apk_variant }}"/*.apk | head -1)
          DEST="MinkowskiKart-${{ env.release_tag }}-android.apk"
          cp "$APK" "$DEST"
          echo "apk_path=$DEST" >> $GITHUB_ENV

      - name: Rename production app bundle
        if: ${{ env.TRUSTED_SIGNING == 'true' && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.production_release_tag != '') }}
        shell: bash
        run: |
          AAB=$(ls android/build/outputs/bundle/release/*.aab | head -1)
          DEST="MinkowskiKart-${{ env.release_tag }}-android.aab"
          cp "$AAB" "$DEST"
          echo "aab_path=$DEST" >> $GITHUB_ENV

      - name: Upload MinkowskiKart Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MinkowskiKart-Android
          path: |
            android/build/outputs/apk/${{ env.android_apk_variant }}/*.apk
            android/build/outputs/bundle/release/*.aab
            MinkowskiKart-*-android.apk
            MinkowskiKart-*-android.aab
          if-no-files-found: warn

  publish:
    name: Publish trusted Android release
    needs: build
    if: ${{ github.event_name != 'pull_request' && needs.build.outputs.release_tag != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MinkowskiKart-Android
      - name: Force update preview tag and release target
        if: ${{ needs.build.outputs.release_tag == 'preview' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh api -X PATCH "repos/$RELEASE_REPOSITORY/git/refs/tags/preview" -F sha="$RELEASE_SHA" -F force=true || true
          gh release edit preview --repo "$RELEASE_REPOSITORY" --target "$RELEASE_SHA" --prerelease || true
      - name: Publish preview APK
        if: ${{ needs.build.outputs.release_tag == 'preview' }}
        uses: ncipollo/release-action@10c84d509b28aae3903113151bfd832314964f2e # v1.8.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: MinkowskiKart-preview-android.apk
          tag: preview
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
      - name: Publish production APK and app bundle
        if: ${{ needs.build.outputs.release_tag != '' && needs.build.outputs.release_tag != 'preview' }}
        uses: ncipollo/release-action@10c84d509b28aae3903113151bfd832314964f2e # v1.8.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "MinkowskiKart-${{ needs.build.outputs.release_tag }}-android.apk,MinkowskiKart-${{ needs.build.outputs.release_tag }}-android.aab"
          tag: ${{ needs.build.outputs.release_tag }}
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          allowUpdates: true
          replacesArtifacts: true
          prerelease: ${{ needs.build.outputs.release_pre }}
