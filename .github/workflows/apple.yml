name: apple
on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request: {}
  workflow_dispatch:
    inputs:
      target_release:
        description: 'Release name to upload to (e.g., version_1 or preview)'
        required: false
        default: 'preview'

permissions:
  contents: read

env:
  TARGET_RELEASE: ${{ github.event.inputs.target_release }}

jobs:
  build:

    strategy:
      fail-fast: true
      matrix:
        platform: [iPhoneOS, MacOSX]
        arch: [arm64, x86_64]
        exclude:
          - platform: iPhoneOS
            arch: x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true
      - name: Configure compiled project version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
            if [[ ! "$TAG_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
              echo 'Invalid release tag.' >&2
              exit 1
            fi
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "project_version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "project_version=git" >> "$GITHUB_ENV"
          fi
      - id: sysroot
        uses: ASzc/change-string-case-action@84a9d7f751ded04b51ef679752b3e54aea018d55 # v1
        with:
          string: ${{ matrix.platform }}
      - name: Download cctools and ISPC
        run: |
          cd /opt
          python "$GITHUB_WORKSPACE/tools/ci/download_verified.py" cctools-14.1.tar.xz
          tar xf cctools-14.1.tar.xz
          rm cctools-14.1.tar.xz
          python "$GITHUB_WORKSPACE/tools/ci/download_verified.py" ispc-cross-1.26.0.tar.xz
          tar xf ispc-cross-1.26.0.tar.xz
          rm ispc-cross-1.26.0.tar.xz
      - name: Restore timestamps
        run: |
          python tools/ci/download_verified.py git-tools.zip
          unzip git-tools.zip
          python git-tools-*/git-restore-mtime
      - name: List build cache restore keys
        run: |
          # Look for the last 9 build caches (GitHub supports max 10 including current one)
          for number in 1 2 3 4 5 6 7 8 9
          do
            id=$((${{ github.run_number }} - number))
            echo "cache_$number=apple-locked-${{ hashFiles('.github/build-inputs.json') }}-${{ github.ref }}-${{ matrix.arch }}-${{ matrix.platform }}-$id" >> $GITHUB_ENV
          done
      - name: Handle build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            apple-build
          key: apple-locked-${{ hashFiles('.github/build-inputs.json') }}-${{ github.ref }}-${{ matrix.arch }}-${{ matrix.platform }}-${{ github.run_number }}
          restore-keys: |
            ${{ env.cache_1 }}
            ${{ env.cache_2 }}
            ${{ env.cache_3 }}
            ${{ env.cache_4 }}
            ${{ env.cache_5 }}
            ${{ env.cache_6 }}
            ${{ env.cache_7 }}
            ${{ env.cache_8 }}
            ${{ env.cache_9 }}
      - name: Download dependencies
        run: |
          python tools/ci/download_verified.py dependencies-${{ steps.sysroot.outputs.lowercase }}.tar.xz
          tar xf dependencies-${{ steps.sysroot.outputs.lowercase }}.tar.xz
      - name: Configure clang runtime name
        run: |
          if [ ${{ matrix.platform }} = "MacOSX" ]; then
            echo "rt=osx" >> $GITHUB_ENV
          elif [ ${{ matrix.platform }} = "iPhoneOS" ]; then
            echo "rt=ios" >> $GITHUB_ENV
          elif [ ${{ matrix.platform }} = "AppleTVOS" ]; then
            echo "rt=tvos" >> $GITHUB_ENV
          elif [ ${{ matrix.platform }} = "iPhoneSimulator" ]; then
            echo "rt=iossim" >> $GITHUB_ENV
          elif [ ${{ matrix.platform }} = "AppleTVSimulator" ]; then
            echo "rt=tvossim" >> $GITHUB_ENV
          fi
      - name: Configure bulid
        run: |
          rm -rf apple-build
          mkdir -p apple-build
          cd apple-build
          cmake .. -DCCTOOLS_PREFIX=/opt/cctools -DCCTOOLS_ARCH=${{ matrix.arch }} -DCCTOOLS_PLATFORM=${{ matrix.platform }} \
          -DRT=/opt/cctools/darwin/libclang_rt.${{ env.rt }}.a -DCMAKE_TOOLCHAIN_FILE=../cmake/Toolchain-cctools.cmake -DCHECK_ASSETS=OFF \
          -DSTK_RELEASE_VERSION=${{ env.project_version }} -DBC7_ISPC=ON -DCMAKE_ISPC_COMPILER=/opt/ispc/bin/ispc
      - name: Build
        run: |
          cd apple-build
          make -j4
          mv bin ../${{ steps.sysroot.outputs.lowercase }}-${{ matrix.arch }}
      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.sysroot.outputs.lowercase }}-${{ matrix.arch }}
          path: ${{ steps.sysroot.outputs.lowercase }}-${{ matrix.arch }}
  packaging:
    name: Packaging MinkowskiKart
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Configure packaging name for git default branch
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        run: |
          echo "release_tag=preview" >> $GITHUB_ENV
          echo "release_name=preview" >> $GITHUB_ENV
          echo "package_tag=preview" >> $GITHUB_ENV
      - name: Configure packaging name for tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "release_tag=`basename $GITHUB_REF`" >> $GITHUB_ENV
          echo "release_name=`basename $GITHUB_REF`" >> $GITHUB_ENV
          echo "package_tag=`basename $GITHUB_REF`" >> $GITHUB_ENV
      - name: Configure packaging name for manual runs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ ! "$TARGET_RELEASE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo 'Invalid release name.' >&2
            exit 1
          fi
          echo "release_tag=$TARGET_RELEASE" >> $GITHUB_ENV
          echo "release_name=$TARGET_RELEASE" >> $GITHUB_ENV
          echo "package_tag=git`date +%Y%m%d`" >> $GITHUB_ENV
      - name: Configure packaging name for non-releasing branch
        if: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "release_tag=" >> $GITHUB_ENV
          echo "release_name=" >> $GITHUB_ENV
          echo "package_tag=" >> $GITHUB_ENV
      - name: Check for prerelease
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || contains(github.ref, 'rc') || contains(github.ref, 'beta') }}
        run: |
          echo "release_pre=true" >> $GITHUB_ENV
      - name: Check for non-prerelease
        if: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && !contains(github.ref, 'rc') && !contains(github.ref, 'beta') }}
        run: |
          echo "release_pre=false" >> $GITHUB_ENV
      - name: Show packaging name
        run : |
          echo "${{ env.release_tag }}"
          echo "${{ env.release_name }}"
          echo "${{ env.package_tag }}"
          echo "${{ env.release_pre }}"
      - name: Force update preview tag and release target to current commit
        if: ${{ env.release_tag == 'preview' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if command -v gh &> /dev/null; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/preview" -F sha="${{ github.sha }}" -F force=true || true
            gh release edit preview --target "${{ github.sha }}" --prerelease || true
          else
            echo "gh CLI not found, skipping tag update"
          fi
      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      - name: Download stk-assets
        if: ${{ env.package_tag != '' }}
        run: |
          python tools/ci/download_verified.py stk-assets-full.zip
      - name: Run dylibbundler and sign macOS build
        if: ${{ env.package_tag != '' }}
        run: |
          python tools/ci/download_verified.py dependencies-macosx.tar.xz
          tar xf dependencies-macosx.tar.xz
          HOMEBREW_NO_AUTO_UPDATE=1 brew install dylibbundler
          lipo -create ./macosx-x86_64/MinkowskiKart.app/Contents/MacOS/MinkowskiKart ./macosx-arm64/MinkowskiKart.app/Contents/MacOS/MinkowskiKart -output ./macosx-arm64/MinkowskiKart.app/Contents/MacOS/MinkowskiKart
          chmod 755 ./macosx-arm64/MinkowskiKart.app/Contents/MacOS/MinkowskiKart
          install_name_tool -delete_rpath @loader_path/Frameworks ./dependencies-macosx/lib/libSDL2.dylib
          install_name_tool -delete_rpath @executable_path/Frameworks ./dependencies-macosx/lib/libSDL2.dylib
          dylibbundler -od -b -x ./macosx-arm64/MinkowskiKart.app/Contents/MacOS/MinkowskiKart -d ./macosx-arm64/MinkowskiKart.app/Contents/libs/ -p @executable_path/../libs/ -s ./dependencies-macosx/lib -ns
          # We use SDL_Vulkan_LoadLibrary for 10.9 compatibility, so otool -L MinkowskiKart has no libMoltenVK.dylib
          cp ./dependencies-macosx/lib/libMoltenVK.dylib ./macosx-arm64/MinkowskiKart.app/Contents/libs/
          cd ./macosx-arm64/MinkowskiKart.app/Contents/Resources/data
          unzip -q ../../../../../stk-assets-full.zip
          cp -r ../../../../../stk-assets/. .
          cp -r ../../../../../data/. .
          mkdir -p replay
          # Ensure the version file matches what the binary expects
          if [[ -f supertuxkart.git ]]; then
            cp supertuxkart.git "supertuxkart.${{ env.package_tag }}"
          fi
          cd ../../../../..
          mv ./macosx-arm64/MinkowskiKart.app MinkowskiKart.app
          # Use Ad Hoc certificate for now, previous certificate has been expired.
          codesign --force -s - MinkowskiKart.app/Contents/libs/*.dylib
          codesign --force --deep -s - MinkowskiKart.app
      - name: Verify packaged configuration defaults
        if: ${{ env.package_tag != '' }}
        run: |
          set -euo pipefail
          CONFIG="MinkowskiKart.app/Contents/Resources/data/stk_config.xml"
          test -f "$CONFIG"
          if grep -Eq '<relativity([[:space:]>])' "$CONFIG"; then
            echo "Packaged stk_config.xml must not contain obsolete app-level relativity settings."
            exit 1
          fi
          grep -Eq 'IntUserConfigParam\([[:space:]]*35,[[:space:]]*"c_light_normal"' src/config/user_config.hpp
          grep -Eq '\{[[:space:]]*0u,[[:space:]]*9u[[:space:]]*\}' src/config/user_config.hpp
          grep -Eq 'StringUserConfigParam\([[:space:]]*"mobius_track",[[:space:]]*"last_track"' src/config/user_config.hpp
      - name: Archive macOS app
        if: ${{ env.package_tag != '' }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent MinkowskiKart.app MinkowskiKart-${{ env.package_tag }}-mac.zip
      - name: Smoke test macOS executable
        if: ${{ env.package_tag != '' }}
        run: |
          # Run unit tests as smoke test. This verifies initialization and basic logic.
          STK_ROOT_DIR=$(pwd)/MinkowskiKart.app/Contents/Resources/data
          export SUPERTUXKART_DATADIR=$(pwd)/MinkowskiKart.app/Contents/Resources
          ./MinkowskiKart.app/Contents/MacOS/MinkowskiKart --root="$STK_ROOT_DIR" --no-graphics --no-sound --unit-testing > smoke_out.txt 2>&1
          SMOKE_EXIT_CODE=$?
          cat smoke_out.txt
          if [ $SMOKE_EXIT_CODE -ne 0 ]; then
            echo "FAILED: Smoke test (unit tests) failed with exit code $SMOKE_EXIT_CODE"
            exit 1
          fi
          if grep -q "Not all assets found" smoke_out.txt; then
            echo "FAILED: asset layout is broken"
            exit 1
          fi
          echo "Smoke test passed: unit tests completed successfully"
      - name: Package iOS IPA
        if: ${{ env.package_tag != '' }}
        run: |
          mkdir -p Payload
          if [ -d "iphoneos-arm64/MinkowskiKart.app" ]; then
            cp -r iphoneos-arm64/MinkowskiKart.app Payload/MinkowskiKart.app
          else
            mkdir -p Payload/MinkowskiKart.app
            cp iphoneos-arm64/MinkowskiKart Payload/MinkowskiKart.app/MinkowskiKart 2>/dev/null || true
          fi
          # Embed stk-assets and repo data into the app bundle
          mkdir -p Payload/MinkowskiKart.app/data
          unzip -q stk-assets-full.zip -d Payload/MinkowskiKart.app/data/
          cp -r stk-assets/. Payload/MinkowskiKart.app/data/
          cp -r data/. Payload/MinkowskiKart.app/data/
          # Ensure the version file matches what the binary expects
          if [[ -f Payload/MinkowskiKart.app/data/supertuxkart.git ]]; then
            cp Payload/MinkowskiKart.app/data/supertuxkart.git \
              "Payload/MinkowskiKart.app/data/supertuxkart.${{ env.package_tag }}"
          fi
          codesign --force --deep -s - Payload/MinkowskiKart.app
          zip -r MinkowskiKart-${{ env.package_tag }}-ios.ipa Payload/
      - name: Upload macOS zip artifact
        if: ${{ env.package_tag != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MinkowskiKart-mac
          path: MinkowskiKart-${{ env.package_tag }}-mac.zip
      - name: Upload iOS IPA artifact
        if: ${{ env.package_tag != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MinkowskiKart-ios
          path: MinkowskiKart-${{ env.package_tag }}-ios.ipa
      - name: Create release
        if: ${{ env.release_tag != '' }}
        uses: ncipollo/release-action@10c84d509b28aae3903113151bfd832314964f2e # v1.8.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "MinkowskiKart-${{ env.package_tag }}-mac.zip,MinkowskiKart-${{ env.package_tag }}-ios.ipa"
          tag: ${{ env.release_name }}
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          allowUpdates: true
          replacesArtifacts: true
          prerelease: ${{ env.release_pre }}
