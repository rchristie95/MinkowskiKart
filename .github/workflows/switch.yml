name: switch
on:
  push:
    branches:
      - master
      - main
      - feature/gh-actions-switch-cache
    tags:
      - '*'
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_switch:
    name: Build Switch
    runs-on: ubuntu-latest
    container:
      image: 'devkitpro/devkita64:20241023'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # We need 0 so we get all commits for mtime!
          fetch-depth: 0
          path: "./stk-code"

      - name: Check if Switch build is supported
        id: check_switch
        run: |
          if [ -d "stk-code/switch" ]; then
            echo "SWITCH_SUPPORTED=true" >> $GITHUB_ENV
          else
            echo "SWITCH_SUPPORTED=false" >> $GITHUB_ENV
            echo "Switch build not supported (no stk-code/switch directory). Skipping build."
          fi

      - name: Grab assets
        if: ${{ env.SWITCH_SUPPORTED == 'true' }}
        run: |
          wget -q https://github.com/supertuxkart/stk-assets-mobile/releases/download/git/stk-assets-full.zip
          unzip -q stk-assets-full.zip -d stk-assets
          rm stk-assets-full.zip

      - name: Restore modified date
        if: ${{ env.SWITCH_SUPPORTED == 'true' }}
        run: |
          cd stk-code
          git restore-mtime . || echo "git-restore-mtime not available or failed"
          cd ..

      # Env setup!
      - name: Configure packaging name for git master/main branch
        if: ${{ env.SWITCH_SUPPORTED == 'true' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        run: |
          echo "release_tag=preview" >> $GITHUB_ENV
          echo "release_name=preview" >> $GITHUB_ENV
      - name: Configure packaging name for tag
        if: ${{ env.SWITCH_SUPPORTED == 'true' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "release_tag=`basename $GITHUB_REF`" >> $GITHUB_ENV
          echo "release_name=`basename $GITHUB_REF`" >> $GITHUB_ENV
      - name: Configure packaging name for non-releasing branch
        if: ${{ env.SWITCH_SUPPORTED == 'true' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "release_tag=" >> $GITHUB_ENV
          echo "release_name=" >> $GITHUB_ENV
      - name: Check for prerelease
        if: ${{ env.SWITCH_SUPPORTED == 'true' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || contains(github.ref, 'rc') || contains(github.ref, 'beta')) }}
        run: |
          echo "release_pre=true" >> $GITHUB_ENV
      - name: Check for non-prerelease
        if: ${{ env.SWITCH_SUPPORTED == 'true' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' && !contains(github.ref, 'rc') && !contains(github.ref, 'beta') }}
        run: |
          echo "release_pre=false" >> $GITHUB_ENV
      - name: Show packaging name
        if: ${{ env.SWITCH_SUPPORTED == 'true' }}
        run : |
          echo "${{ env.release_tag }}"
          echo "${{ env.release_name }}"
          echo "${{ env.release_pre }}"
      - name: Verify configuration defaults
        if: ${{ env.SWITCH_SUPPORTED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '<relativity([[:space:]>])' stk-code/data/stk_config.xml; then
            echo "stk_config.xml must not contain obsolete app-level relativity settings."
            exit 1
          fi
          grep -Eq 'IntUserConfigParam\([[:space:]]*35,[[:space:]]*"c_light_normal"' stk-code/src/config/user_config.hpp
          grep -Eq '\{[[:space:]]*0u,[[:space:]]*9u[[:space:]]*\}' stk-code/src/config/user_config.hpp
          grep -Eq 'StringUserConfigParam\([[:space:]]*"mobius_track",[[:space:]]*"last_track"' stk-code/src/config/user_config.hpp
      - name: Force update preview tag and release target to current commit
        if: ${{ env.SWITCH_SUPPORTED == 'true' && env.release_tag == 'preview' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if command -v gh &> /dev/null; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/preview" -F sha="${{ github.sha }}" -F force=true || true
            gh release edit preview --target "${{ github.sha }}" --prerelease || true
          else
            echo "gh CLI not found, skipping tag update"
          fi
      - name: List build cache restore keys
        if: ${{ env.SWITCH_SUPPORTED == 'true' }}
        shell : bash
        run: |
          # Look for the last 9 build caches (GitHub supports max 10 including current one)
          for number in 1 2 3 4 5 6 7 8 9
          do
            id=$((${{ github.run_number }} - number))
            echo "cache_$number=switch-${{ github.ref }}-$id" >> $GITHUB_ENV
          done
      - name: Handle build cache
        if: ${{ env.SWITCH_SUPPORTED == 'true' }}
        uses: actions/cache@v4
        with:
          # This is unnecessarily verbose and might break, but again ! seems broken
          # See: https://github.com/Mstrodl/stk-code/runs/2333673736?check_suite_focus=true#step:16:34
          path: |
            stk-code/cmake_build/CMakeFiles
            stk-code/cmake_build/Makefile
            stk-code/cmake_build/lib
            stk-code/cmake_build/bin/supertuxkart
            stk-code/cmake_build/*.cmake
            stk-code/cmake_build/*.txt

          # Make sure PRs can't overwrite!
          key: switch-${{ github.ref }}-${{ github.run_number }}
          restore-keys: |
            ${{ env.cache_1 }}
            ${{ env.cache_2 }}
            ${{ env.cache_3 }}
            ${{ env.cache_4 }}
            ${{ env.cache_5 }}
            ${{ env.cache_6 }}
            ${{ env.cache_7 }}
            ${{ env.cache_8 }}
            ${{ env.cache_9 }}
      - name: Run build script
        if: ${{ env.SWITCH_SUPPORTED == 'true' }}
        run: |
          if [ ! -d "stk-code/switch" ]; then
            echo "No switch build directory found in this repository, skipping Switch build."
            exit 0
          fi
          cd stk-code/switch
          PROJECT_VERSION="${{ env.release_tag }}" ./make.sh
      - name: Create release
        uses: ncipollo/release-action@v1.8.8
        if: ${{ env.SWITCH_SUPPORTED == 'true' && env.release_tag != '' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "stk-code/cmake_build/bin/SuperTuxKart-${{ env.release_tag }}-switch.zip"
          tag: ${{ env.release_name }}
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          allowUpdates: true
          replacesArtifacts: true
          prerelease: ${{ env.release_pre }}
