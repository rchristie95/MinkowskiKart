name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/validate_publication.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tools/validate_publication.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy' }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check metadata, structured data, assets, and local links
        run: python tools/validate_publication.py

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed pages and external links
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python tools/validate_publication.py --external; then
              exit 0
            fi
            if [[ "$attempt" != "6" ]]; then
              sleep 10
            fi
          done
          exit 1
