services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      MK_ONLINE_DOMAIN: ${MK_ONLINE_DOMAIN}
      MK_PERSONAL_DOMAIN: ${MK_PERSONAL_DOMAIN}
      MK_PERSONAL_WWW_DOMAIN: ${MK_PERSONAL_WWW_DOMAIN}
      MK_SITE_DOMAIN: ${MK_SITE_DOMAIN}
      MK_GEEKLOVE_DOMAIN: ${MK_GEEKLOVE_DOMAIN}
      MK_GEEKLOVE_WWW_DOMAIN: ${MK_GEEKLOVE_WWW_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Behind Cloudflare: serve the Cloudflare Origin Certificate for the
      # proxied sites (see Caddyfile.cloudflare + CLOUDFLARE.md). To run
      # without Cloudflare, point this back at ./Caddyfile and drop ./certs.
      - ./Caddyfile.cloudflare:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ./site/robsonchristie:/srv/robsonchristie:ro
      - ./site/minkowskikart:/srv/minkowskikart:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      api_proxy:
        ipv4_address: 172.30.0.2

  api:
    build:
      context: ../../services/online-api
    restart: unless-stopped
    environment:
      MK_DATABASE_URL: postgresql+psycopg://minkowski:${POSTGRES_PASSWORD}@postgres/minkowski
      MK_REDIS_URL: redis://redis:6379/0
      MK_ALLOWED_GAME_VERSION: ${MK_ALLOWED_GAME_VERSION:-7}
      MK_JOIN_MAX_ENTRIES: ${MK_JOIN_MAX_ENTRIES:-64}
      MK_JOIN_MAX_PAYLOAD_BYTES: ${MK_JOIN_MAX_PAYLOAD_BYTES:-4096}
      MK_JOIN_MAX_REQUEST_BYTES: ${MK_JOIN_MAX_REQUEST_BYTES:-8192}
      MK_TRUSTED_PROXY_IPS: ${MK_TRUSTED_PROXY_IPS:-172.30.0.2}
      # Used by `app.admin ensure-official-host` on boot to idempotently
      # provision the account the dedicated server signs in with.
      MK_OFFICIAL_USERNAME: ${MK_OFFICIAL_USERNAME:-official-host}
      MK_OFFICIAL_PASSWORD: ${MK_OFFICIAL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default: {}
      api_proxy:
        ipv4_address: 172.30.0.3
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: minkowski
      POSTGRES_USER: minkowski
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minkowski -d minkowski"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  stun:
    image: coturn/coturn:4.6.3
    profiles: ["owned-stun"]
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf"]
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro        

  official-server:
    build:
      context: ../..
      dockerfile: deploy/online/Dockerfile.game-server
      args:
        MK_ONLINE_DOMAIN: ${MK_ONLINE_DOMAIN}
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      MK_ONLINE_DOMAIN: ${MK_ONLINE_DOMAIN}
      MK_OFFICIAL_USERNAME: ${MK_OFFICIAL_USERNAME}
      MK_OFFICIAL_PASSWORD: ${MK_OFFICIAL_PASSWORD}
      MK_OFFICIAL_TRACK: ${MK_OFFICIAL_TRACK:-mobius_track}     
      MK_OFFICIAL_BOTS: ${MK_OFFICIAL_BOTS:-3}
      MK_OFFICIAL_MIN_PLAYERS: ${MK_OFFICIAL_MIN_PLAYERS:-1}    
    ports:
      - "2759:2759/udp"
    volumes:
      - ./official_server_config.xml:/config/server_config.xml:ro
      - official_server_data:/var/lib/minkowskikart
    depends_on:
      caddy:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  official_server_data:

networks:
  api_proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/29
